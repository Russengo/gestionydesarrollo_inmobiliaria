<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel de Administración - Siandra</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        :root {
            --gold: #d4a34b;
            --gold-hover: #b88a38;
            --dark-blue: #171728;
            --dark-blue-light: #24243e;
            --light-cream: #faf8f4;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--light-cream);
            min-height: 100vh;
        }

        .serif-font {
            font-family: 'Playfair Display', serif;
        }

        .navbar {
            background-color: var(--dark-blue);
        }

        .logo-icon {
            background-color: var(--gold);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .admin-card {
            background-color: white;
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .empty-icon {
            width: 70px;
            height: 70px;
            background-color: var(--light-cream);
            color: var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 20px;
        }

        .btn-gold {
            background-color: var(--gold);
            color: white;
            border: none;
        }

        .btn-gold:hover {
            background-color: var(--gold-hover);
            color: white;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark">
        <div class="container">

            <a
                class="navbar-brand d-flex align-items-center gap-2"
                href="#"
            >
                <div class="logo-icon">
                    <i class="bi bi-building"></i>
                </div>

                <span class="serif-font">
                    Siandra - Admin
                </span>
            </a>

            <button
                id="logoutButton"
                class="btn btn-outline-light btn-sm"
            >
                <i class="bi bi-box-arrow-right me-1"></i>
                Cerrar sesión
            </button>

        </div>
    </nav>


    <!-- Contenido -->
    <main class="container py-5">

        <div class="admin-card p-5 text-center">

            <div class="empty-icon">
                <i class="bi bi-hourglass-split"></i>
            </div>

            <h1 class="serif-font mb-3">
                Panel de Gestión
            </h1>

            <p class="text-muted mb-0">
                Todavía no hay nada para gestionar.
            </p>

        </div>

    </main>


    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Nuestro cliente -->
    <script src="supabaseClient.js"></script>


    <script>

        const logoutButton =
            document.getElementById('logoutButton');


        // Verificar que exista una sesión
        async function comprobarSesion() {

            try {

                const { data, error } =
                    await supabaseClient.auth.getSession();

                if (error) {

                    console.error(
                        'Error al comprobar sesión:',
                        error
                    );

                    window.location.href = 'login.html';

                    return;
                }

                // Si no hay sesión, volver al login
                if (!data.session) {

                    window.location.href = 'login.html';

                }

            } catch (error) {

                console.error(
                    'Error inesperado:',
                    error
                );

                window.location.href = 'login.html';
            }
        }


        comprobarSesion();


        // Cerrar sesión
        logoutButton.addEventListener(
            'click',
            async function() {

                logoutButton.disabled = true;
                logoutButton.innerHTML =
                    '<span class="spinner-border spinner-border-sm me-1"></span> Cerrando...';

                try {

                    const { error } =
                        await supabaseClient.auth.signOut({
                            scope: 'local'
                        });

                    if (error) {

                        console.error(
                            'Error al cerrar sesión:',
                            error
                        );

                        logoutButton.disabled = false;
                        logoutButton.innerHTML =
                            '<i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión';

                        return;
                    }

                    // Sesión eliminada correctamente
                    window.location.href = 'login.html';

                } catch (error) {

                    console.error(
                        'Error inesperado al cerrar sesión:',
                        error
                    );

                    logoutButton.disabled = false;
                    logoutButton.innerHTML =
                        '<i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión';
                }

            }
        );

    </script>

</body>
</html>
