<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel de Gestión - Siandra</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="admin.css">
    <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Barra superior -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="admin.html">
                <i class="bi bi-building me-2"></i>
                Siandra - Admin
            </a>

            <div class="d-flex align-items-center gap-3">
                <span id="accountEmail" class="text-light"></span>

                <button
                    id="logoutButton"
                    type="button"
                    class="btn btn-outline-light btn-sm"
                >
                    <i class="bi bi-box-arrow-right me-1"></i>
                    Cerrar sesión
                </button>
            </div>
        </div>
    </nav>

    <!-- Estructura principal -->
    <div class="container-fluid">
        <div class="row min-vh-100">

            <!-- Menú lateral -->
            <aside id="sidebar" class="col-md-3 col-lg-2 bg-white border-end p-3">

                <div class="text-secondary small fw-bold mb-2">
                    GENERAL
                </div>

                <button
                    type="button"
                    class="nav-module active btn btn-light w-100 text-start mb-2"
                    data-module="inicio"
                >
                    <i class="bi bi-grid-1x2 me-2"></i>
                    Inicio
                </button>

                <div class="text-secondary small fw-bold mt-4 mb-2">
                    GESTIÓN INMOBILIARIA
                </div>

                <button
                    type="button"
                    class="nav-module btn btn-light w-100 text-start mb-2"
                    data-module="propiedades"
                >
                    <i class="bi bi-houses me-2"></i>
                    Propiedades
                </button>

                <button
                    type="button"
                    class="nav-module btn btn-light w-100 text-start mb-2"
                    data-module="personas"
                >
                    <i class="bi bi-people me-2"></i>
                    Personas y clientes
                </button>

                <button
                    type="button"
                    class="nav-module btn btn-light w-100 text-start mb-2"
                    data-module="visitas"
                >
                    <i class="bi bi-calendar-week me-2"></i>
                    Visitas y agenda
                </button>

                <button
                    type="button"
                    class="nav-module btn btn-light w-100 text-start mb-2"
                    data-module="contratos"
                >
                    <i class="bi bi-file-earmark-text me-2"></i>
                    Contratos
                </button>

                <div class="text-secondary small fw-bold mt-4 mb-2">
                    ADMINISTRACIÓN
                </div>

                <button
                    type="button"
                    class="nav-module btn btn-light w-100 text-start mb-2"
                    data-module="finanzas"
                >
                    <i class="bi bi-cash-stack me-2"></i>
                    Finanzas y cobros
                </button>

                <button
                    type="button"
                    class="nav-module btn btn-light w-100 text-start mb-2"
                    data-module="auditoria"
                >
                    <i class="bi bi-clock-history me-2"></i>
                    Auditoría
                </button>

            </aside>

            <!-- Contenido principal -->
            <main class="col-md-9 col-lg-10 p-4">

                <div class="d-flex align-items-center gap-3 mb-4">
                    <button
                        id="mobileMenuButton"
                        type="button"
                        class="btn btn-outline-secondary d-md-none"
                        aria-label="Mostrar menú"
                        aria-expanded="false"
                    >
                        <i class="bi bi-list"></i>
                    </button>

                    <div class="text-secondary">
                        Siandra /
                        <span id="breadcrumb">Inicio</span>
                    </div>
                </div>

                <!-- Aquí se cargan los módulos -->
                <section
                    id="moduleContent"
                    aria-live="polite"
                ></section>

            </main>

        </div>
    </div>

    <!-- Librerías y archivos JavaScript: respetar este orden -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script src="admin.js"></script>

</body>
</html>
