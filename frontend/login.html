<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso Seguro - Siandra</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        :root {
            --gold: #d4a34b;
            --gold-hover: #b88a38;
            --dark-blue: #171728;
            --dark-blue-light: #24243e;
            --light-cream: #faf8f4;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark-blue);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background-color: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .logo-icon {
            background-color: var(--gold);
            color: white;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 20px;
        }

        .serif-font {
            font-family: 'Playfair Display', serif;
        }

        .text-gold {
            color: var(--gold);
        }

        .btn-gold {
            background-color: var(--gold);
            color: white;
            border: none;
        }

        .btn-gold:hover {
            background-color: var(--gold-hover);
            color: white;
        }

        .form-control:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 0.2rem rgba(212, 163, 75, 0.15);
        }

        .error-message {
            display: none;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo-icon">
            <i class="bi bi-building"></i>
        </div>

        <div class="text-center mb-4">
            <h2 class="serif-font mb-1">Acceso Seguro</h2>
            <p class="text-muted mb-0">Panel de administración</p>
        </div>

        <div id="errorMessage" class="alert alert-danger error-message"></div>

        <form id="loginForm">

            <div class="mb-3">
                <label for="email" class="form-label">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="correo@ejemplo.com"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">
                    Contraseña
                </label>

                <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="••••••••"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button
                type="submit"
                id="loginButton"
                class="btn btn-gold w-100 py-2"
            >
                Ingresar
            </button>

        </form>

    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Nuestro cliente -->
    <script src="supabaseClient.js"></script>

    <script>

        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginButton = document.getElementById('loginButton');
        const errorMessage = document.getElementById('errorMessage');

        function mostrarError(mensaje) {
            errorMessage.textContent = mensaje;
            errorMessage.style.display = 'block';
        }

        function ocultarError() {
            errorMessage.textContent = '';
            errorMessage.style.display = 'none';
        }


        // Comprobar que nuestro cliente exista
        if (!supabaseClient) {

            mostrarError(
                'No se pudo inicializar Supabase.'
            );

            loginButton.disabled = true;

        } else {

            console.log('Cliente de Supabase cargado correctamente.');

        }


        // Comprobar si ya existe una sesión
        async function comprobarSesion() {

            if (!supabaseClient) {
                return;
            }

            try {

                const { data, error } =
                    await supabaseClient.auth.getSession();

                if (error) {

                    console.error(
                        'Error al comprobar sesión:',
                        error
                    );

                    return;
                }

                if (data.session) {

                    console.log(
                        'Ya existe una sesión. Redirigiendo...'
                    );

                    window.location.href = 'admin.html';

                }

            } catch (error) {

                console.error(
                    'Error inesperado:',
                    error
                );

            }
        }

        comprobarSesion();


        // Login
        form.addEventListener('submit', async function(event) {

            event.preventDefault();

            ocultarError();

            if (!supabaseClient) {

                mostrarError(
                    'Supabase no está disponible.'
                );

                return;
            }

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {

                mostrarError(
                    'Completá el correo electrónico y la contraseña.'
                );

                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = 'Ingresando...';

            try {

                console.log('Intentando iniciar sesión...');
                console.log('Email:', email);

                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                console.log('Respuesta de Supabase:', {
                    data: data,
                    error: error
                });


                // Si Supabase devuelve un error
                if (error) {

                    console.error(
                        'Error de Supabase:',
                        error
                    );

                    mostrarError(
                        error.message ||
                        'No se pudo iniciar sesión.'
                    );

                    loginButton.disabled = false;
                    loginButton.textContent = 'Ingresar';

                    return;
                }


                // Verificar que realmente haya una sesión
                if (!data || !data.session) {

                    mostrarError(
                        'Supabase no devolvió una sesión válida.'
                    );

                    loginButton.disabled = false;
                    loginButton.textContent = 'Ingresar';

                    return;
                }


                // Login correcto
                console.log(
                    'Login correcto. Redirigiendo al panel...'
                );

                window.location.href = 'admin.html';

            } catch (error) {

                console.error(
                    'Error inesperado:',
                    error
                );

                mostrarError(
                    error.message ||
                    'Ocurrió un error al iniciar sesión.'
                );

                loginButton.disabled = false;
                loginButton.textContent = 'Ingresar';
            }

        });

    </script>

</body>
</html>
